# 基础设施组件清单 —— 各组件版本独立于应用本体版本演进
#
# 每次升级某个组件后，同步更新这里的 version 与 updated 字段。
# 应用回退（deploy/rollback.sh）不会修改本文件：回退只作用于 Python 应用，
# 基础设施保持原样。

schema_version: 1

components:
  - name: phoenix
    description: Arize Phoenix —— trace 存储、评估 UI（对应架构方案 §4.3）
    version: "0.0.0-unpinned"
    image: arizephoenix/phoenix
    image_tag: latest
    compose_file: infra/phoenix/compose.yaml
    setup_script: infra/phoenix/setup.sh
    port: 6006
    state: not-deployed
    updated: ""
    notes: >-
      首次部署（B3）验证通过后，把 image_tag 从 latest 固定为具体版本号，
      并在应用配置中记录该版本，避免上游 latest 变动导致回退后行为不一致。

  - name: embedding-model
    description: sentence-transformers 嵌入模型（D1，中文 bge-base-zh-v1.5，768 维）
    version: "BAAI/bge-base-zh-v1.5@f03589ceff5aac7111bd60cfc7d497ca17ecac65"
    manifest: infra/models/manifest.json
    setup_script: infra/models/setup.sh
    state: not-deployed
    updated: ""
    notes: >-
      目标机**直接下载**（HF_ENDPOINT 镜像备用）；文件级 sha256 在
      manifest.lock.json（首次 install 后生成，写入部署根 integrity/models/，
      不跟应用版本号、只跟模型身份，覆盖即更新；不入 git）。
      升级模型 = 改 manifest.revision + 重跑 setup.sh install。

  - name: spacy-model
    description: spaCy 英文 NER 模型（D2，en_core_web_lg）
    version: "3.8.0"
    manifest: infra/spacy/manifest.json
    setup_script: infra/spacy/setup.sh
    state: not-deployed
    updated: ""
    notes: >-
      装入 shared/venv（与应用大依赖同 venv，指纹复用兼容）；校验以
      spacy.load 真实可加载为准；pip 受限时在组件 env 配 PIP_INDEX_URL。

dependencies:
  - name: docker-engine
    version: "29.1.4"
    required_by: [phoenix]
    state: satisfied
    notes: 目标机实测版本

  - name: docker-compose
    version: "5.0.1"
    required_by: [phoenix]
    state: satisfied
    notes: 以 cli-plugin 形式安装于 /usr/libexec/docker/cli-plugins
