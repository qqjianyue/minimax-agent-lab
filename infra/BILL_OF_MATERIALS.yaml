# 基础设施组件清单 —— 各组件版本独立于应用本体版本演进
#
# 每次升级某个组件后，同步更新这里的 version 与 updated 字段。
# 应用回退（deploy/rollback.sh）不会修改本文件：回退只作用于 Python 应用，
# 基础设施保持原样。

schema_version: 1

components:
  - name: phoenix
    description: Arize Phoenix —— trace 存储、评估 UI（对应架构方案 §4.3）
    version: "20.20.0"
    image: arizephoenix/phoenix
    image_tag: 20.20.0
    #: 镜像 ID（config digest）—— 目标机上 `docker inspect` 的 ImageID
    image_id: "sha256:f66af1843d0dccc2027e577393a544324f11b17ba033dce90343c4e66e1fd539"
    #: manifest list digest —— 上游 tag 20.20.0 的 registry digest
    image_digest: "sha256:3a2e5a049f706f29c7b13bd82bcd94101bb10701874ce134ec9eb7f0299741aa"
    compose_file: infra/phoenix/compose.yaml
    setup_script: infra/phoenix/setup.sh
    port: 6006
    state: deployed
    updated: "2026-10-24"
    notes: >-
      容器 minimax-agent-phoenix（healthcheck exec 形式直调 python3.13，
      镜像无 /bin/sh 不能用 CMD-SHELL）；数据在 shared/data/phoenix，
      应用回退不丢。目标机不能直连 Docker Hub（registry-1.docker.io EOF），
      只能走镜像加速器拉取。
      tag 已固定为 20.20.0（上游 tag 名不带 v 前缀）—— manifest list digest
      与目标机 `docker image inspect` 的 RepoDigests 逐字符交叉验证一致，
      即 pin 后 compose pull 拉到的是同一个镜像。latest 已于 2026-10-23
      漂到 20.26.0（digest 095f4987…），跟随 latest 会在一次 pull 里
      把生产环境换成未验证版本，故 compose.yaml 不再给 TAG 默认值。
      组件配置（infra/phoenix/env）在目标机仓库副本里，**不进 release** ——
      基础设施独立于核心服务的 release 生命周期（回退只切 current 符号链接）。
      应用侧 telemetry.enabled=true 已固化进 deploy/env.template，
      trace 落库已验证（FT-11）：default 项目实测 traceCount=2036，
      覆盖 2026-10-10 ~ 2026-10-12。

  - name: embedding-model
    description: sentence-transformers 嵌入模型（D1，中文 bge-base-zh-v1.5，768 维）
    version: "BAAI/bge-base-zh-v1.5@f03589ceff5aac7111bd60cfc7d497ca17ecac65"
    manifest: infra/models/manifest.json
    setup_script: infra/models/setup.sh
    state: deployed
    updated: "2026-10-10"
    notes: >-
      目标机**直接下载**（HF_ENDPOINT 镜像备用）；文件级 sha256 在
      manifest.lock.json（首次 install 后生成，写入部署根 integrity/models/，
      不跟应用版本号、只跟模型身份，覆盖即更新；不入 git）。
      升级模型 = 改 manifest.revision + 重跑 setup.sh install。

  - name: spacy-model
    description: spaCy 英文 NER 模型（D2，en_core_web_lg）
    version: "3.8.0"
    manifest: infra/spacy/manifest.json
    setup_script: infra/spacy/setup.sh
    state: deployed
    updated: "2026-10-10"
    notes: >-
      装入 shared/venv（与应用大依赖同 venv，指纹复用兼容）；校验以
      spacy.load 真实可加载为准；pip 受限时在组件 env 配 PIP_INDEX_URL。
      wheel 持久化在 /data/workspace/tmp（/tmp 重启会清空）。

dependencies:
  - name: docker-engine
    version: "29.1.4"
    required_by: [phoenix]
    state: satisfied
    notes: 目标机实测版本

  - name: docker-compose
    version: "5.0.1"
    required_by: [phoenix]
    state: satisfied
    notes: 以 cli-plugin 形式安装于 /usr/libexec/docker/cli-plugins
