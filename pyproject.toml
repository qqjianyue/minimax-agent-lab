[project]
name = "minimax-agent"
version = "0.1.6"
description = "MiniMax-backed local agent with layered guardrails and full-chain observability"
requires-python = ">=3.12"
readme = "README.md"

# 运行期依赖 —— 按批次逐步引入，不提前背上重依赖。
#
# OTel 是 B4 引入的：C9 的 `build_telemetry` 声明"缺 OTel 则退回 NoOp"，
# 但那只是**防御**（部分安装的环境），不是常态 —— 真实部署里遥测是要打开的，
# 所以这两个包在这里是硬依赖；否则打包出去的服务永远只会走 NoOp 分支，
# 而那条分支在本地也测不到真实行为。
#
# B5 的重依赖（Presidio / sentence-transformers / spacy，含 torch）**不进主依赖**：
# torch 在 Windows 本地不现实（决策 D7），本地 L0/L1 用 Fake + skipif 测契约，
# 目标机部署时 ensure_venv 加 `--extra ml` 才装全量（见 deploy/lib/common.sh）。
# jsonschema 是 C6 工具参数校验，轻量，进主依赖。
dependencies = [
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "jsonschema>=4.23",
    "langgraph>=1.2.14",
]

# B5：ML 检测器（C5）的重依赖，只在目标机 venv 安装（--extra ml）。
# 本地 `uv sync` 不带该 extra，保持轻量。
[project.optional-dependencies]
ml = [
    "presidio-analyzer>=2.2.358",
    "sentence-transformers>=3.0",
    "spacy>=3.7,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "ruff>=0.7",
]

# ---------------------------------------------------------------------------
# 构建：单仓多包。所有包共享同一个版本号（决策 Q7：应用本体统一版本管理）。
# 版本唯一来源是本文件，改版本只需要改这一处。
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent_core",
    "src/guard_contract",
    "src/policy_engine",
    "src/detector_rules",
    "src/detector_ml",
    "src/agent_tools",
    "src/llm_minimax",
    "src/agent_service",
    "src/telemetry",
    "src/audit_ledger",
]

# ---------------------------------------------------------------------------
# 测试分层（L0 单元 / L1 集成 / target 目标机专属）
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not target' --strict-markers -q"
markers = [
    "unit: L0 纯函数单元测试，完全离线",
    "integration: L1 集成测试，使用 Fake 依赖，完全离线",
    "target: 仅在目标机执行的测试，需要真实模型或网络（smoke / functional）",
]

# ---------------------------------------------------------------------------
# 覆盖率：L0/L1 必须达到的门槛
#
# fail_under 是**合并口径**（L0 + L1 一起跑）的下限，不是单层的下限：
# L1 单跑只有 68%（大量代码只被单元测试触达），拿单层数字当闸门没有意义。
# 因此单层命令由 tasks.py 显式传 --cov-fail-under=0 关闭强制，
# check / test-offline 才是真正执行这道门槛的地方。
#
# 89.9 而不是 90：留 0.1 的余量，避免分支覆盖率的小数抖动卡住提交。
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 89.9
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# 静态检查
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
package = true
